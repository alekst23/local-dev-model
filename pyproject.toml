[project]
name = "local-ollama-proxy"
version = "0.1.0"
description = "Mini local proxy app that bridges chat completion clients to Ollama."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0.0,<4.0.0",
  "requests>=2.31.0,<3.0.0",
]

[project.scripts]
ollama-proxy = "ollama_proxy.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
